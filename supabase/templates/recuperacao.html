<h2>Crie uma nova senha</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta no crTOUR. Clique no link abaixo para criar uma nova senha:</p>
<p><a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery&next=/nova-senha">Criar nova senha</a></p>
<p>Se você não pediu isso, ignore este e-mail: sua senha continua a mesma.</p>
